<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Presence</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#6b7280;--ok:#16a34a;--line:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--fg:#e8eaed;--mut:#9aa0a6;--line:#2a313a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:720px;margin:auto;padding:16px}h1{font-size:22px;margin:8px 0 4px}h2{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}.on .dot{background:var(--ok)}
.mut{color:var(--mut);font-size:13px}button,input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{cursor:pointer}button.pri{background:var(--fg);color:var(--bg);border:0}button.x{border:0;color:var(--mut);padding:4px 8px}
form{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}form input{flex:1;min-width:120px}details summary{cursor:pointer}code{font-size:12px}
</style></head><body><main>
<div class="row"><h1 class="grow">Who's in</h1><span class="mut" id="ts"></span></div>
<div id="present"></div>
<h2>Profiles</h2><div id="profiles"></div>
<form id="newp"><input name="name" placeholder="New person name" required><button class="pri">Add</button></form>
<h2>Unknown devices</h2><div id="unknown" class="mut"></div>
<p class="mut"><span id="keyinfo"></span> · <a href="/docs">API docs</a></p>
</main><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>`&#${c.charCodeAt(0)};`);
let KEY=localStorage.getItem('opkey')||'', profiles=[];
const ago=t=>{if(!t)return'never';const s=Date.now()/1000-t;return s<60?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago'};
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json','X-API-Key':KEY},body:b?JSON.stringify(b):undefined});
 if(r.status==401){KEY=prompt('API key required')||'';localStorage.setItem('opkey',KEY);return api(m,u,b)}
 if(!r.ok){alert((await r.json().catch(()=>({}))).detail||r.status);throw r}return r.status==204?null:r.json()}
async function load(){
 const [p,u]=await Promise.all([api('GET','/api/presence'),api('GET','/api/devices/unknown')]);
 profiles=[...p.present,...p.absent].sort((a,b)=>a.name.localeCompare(b.name));
 $('#ts').textContent='updated '+new Date().toLocaleTimeString();
 $('#present').innerHTML=p.present.length?p.present.map(x=>`<div class="card row on"><span class="dot"></span><b class="grow">${esc(x.name)}</b><span class="mut">${ago(x.last_seen)}</span></div>`).join(''):'<div class="card mut">Nobody detected right now.</div>';
 $('#profiles').innerHTML=profiles.map(x=>`<div class="card ${x.present?'on':''}"><details><summary class="row"><span class="dot"></span><b class="grow">${esc(x.name)}</b><span class="mut">${x.devices.length} dev · ${ago(x.last_seen)}</span></summary>
  ${x.devices.map(d=>`<div class="row"><span class="grow">${esc(d.label||'device')} <code>${d.mac}</code> <span class="mut">${ago(d.last_seen)}</span></span><button class="x" onclick="delDev(${x.id},'${d.mac}')">✕</button></div>`).join('')}
  <form onsubmit="addDev(event,${x.id})"><input name="mac" placeholder="MAC aa:bb:cc:dd:ee:ff" required><input name="label" placeholder="Label (phone, laptop)"><button>Add device</button></form>
  <p><button class="x" onclick="rename(${x.id},'${esc(x.name)}')">Rename</button><button class="x" onclick="delP(${x.id})">Delete profile</button></p></details></div>`).join('')||'<div class="card mut">No profiles yet.</div>';
 const opts=profiles.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
 $('#unknown').innerHTML=u.length?u.map(d=>`<div class="card row"><span class="grow"><code>${d.mac}</code> <span class="mut">${esc(d.ip)} · ${ago(d.last_seen)}</span></span>${profiles.length?`<select id="s${d.mac}">${opts}</select><button onclick="assign('${d.mac}')">Assign</button>`:''}</div>`).join(''):'None seen recently.';
}
async function addDev(e,id){e.preventDefault();const f=new FormData(e.target);await api('POST',`/api/profiles/${id}/devices`,{mac:f.get('mac'),label:f.get('label')});load()}
async function delDev(id,mac){if(confirm('Remove device '+mac+'?')){await api('DELETE',`/api/profiles/${id}/devices/${mac}`);load()}}
async function delP(id){if(confirm('Delete profile?')){await api('DELETE',`/api/profiles/${id}`);load()}}
async function rename(id,n){const name=prompt('New name',n);if(name){await api('PUT',`/api/profiles/${id}`,{name});load()}}
async function assign(mac){const id=document.getElementById('s'+mac).value,label=prompt('Label for this device','phone')??'';await api('POST',`/api/profiles/${id}/devices`,{mac,label});load()}
$('#newp').onsubmit=async e=>{e.preventDefault();await api('POST','/api/profiles',{name:e.target.name.value});e.target.reset();load()};
fetch('/health').then(r=>r.json()).then(h=>$('#keyinfo').textContent=h.auth_required?'Editing requires API key':'Open editing (no API key set)');
load();setInterval(load,15000);
</script></body></html>
